# Living World server: paste this into a Portainer stack (Stacks > Add stack > Web editor) or run `docker compose up -d`.
# You must own Command & Conquer Generals Zero Hour: the image has no game files. Put a copy of the install folder on the host and set ZH_FILES.
services:
  living-world:
    image: ghcr.io/dwatson251/zh-living-world:${LW_TAG:-latest}
    container_name: living-world
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${LW_PORT:-7777}:7777/tcp"     # game
      - "${LW_STATUS_PORT:-8080}:8080/tcp"   # status page
    volumes:
      - lw-world:/data/world                          # the saved worlds, one folder per map (keep this!)
      - ${ZH_FILES:-/srv/zerohour}:/data/zerohour:ro,z   # YOUR Zero Hour install folder (read-only; ,z = SELinux label for CentOS)
    environment:
      # ---- [server]
      LW_NAME: "${LW_NAME:-Living World}"                    # Server name
      # Map codenames: <city>-<size>. Each map keeps its own persistent world in the volume (/data/world/<codename>); switch freely and come back.
      #   cities:  london, newyork, paris, dubai  (real streets, parks, rivers and bridges from OpenStreetMap, at real scale)
      #   sizes:   -small   1.4 km, the largest map size retail Zero Hour ships; light enough for older PCs, ~10-20 players
      #            -medium  4.8 km, ~60-90 players
      #            -large   10 km, up to 128 players; needs a fast CPU on the server and every client
      #   e.g. london-medium, newyork-small, dubai-large
      #   grand    Living World Grand: generated hills, 1.6 km, up to 128 players
      #   desert   Tournament Desert: the small retail map
      # (a path such as "Maps\\Some Map\\Some Map.map" also works)
      LW_MAP: "${LW_MAP:-london-medium}"                     # Map (codename or .map path)
      LW_PORT: "7777"                                        # Game port (inside the container; change the published port above)
      LW_STATUS_PORT: "8080"                                 # Status page port (0 = off) (inside the container; change the published port above)
      # ---- [world]
      LW_MAX_PLAYERS: "${LW_MAX_PLAYERS:-16}"                # Max players (seats)
      LW_MAX_AI: "${LW_MAX_AI:-16}"                          # Max AI players at once
      LW_START_AI: "${LW_START_AI:-4}"                       # AI players at world start
      LW_AI_POOL: "${LW_AI_POOL:-24}"                        # AI seats (at least max AI)
      LW_GAME_SPEED: "${LW_GAME_SPEED:-30}"                  # Game speed (15-60, default 30)
      LW_AI_JOIN_SECS: "${LW_AI_JOIN_SECS:-20}"              # Seconds between AI joining
      LW_EPOCH_SECS: "${LW_EPOCH_SECS:-auto}"                # Save the world every (secs, auto)
      LW_SPAWN_DEADZONE: "${LW_SPAWN_DEADZONE:-auto}"        # Spawn deadzone (metres, auto)
      LW_AI_RESERVE_LOTS: "${LW_AI_RESERVE_LOTS:-4}"         # Spawn lots kept free for players
      # ---- [rules]
      LW_START_CASH: "${LW_START_CASH:-10000}"               # Starting cash
      LW_LAST_HIT_PERCENT: "${LW_LAST_HIT_PERCENT:-10}"      # Knock-out bonus: % of victim cash
      LW_LAST_HIT_BONUS: "${LW_LAST_HIT_BONUS:-10000}"       # Knock-out bonus: flat amount
      LW_LAST_HIT_WINDOW_SECS: "${LW_LAST_HIT_WINDOW_SECS:-300}" # Last hit counts for (seconds)
      LW_SUPPLY_CASH: "${LW_SUPPLY_CASH:-0}"                 # Supply dock refill: cash per time
      LW_SUPPLY_INTERVAL_SECS: "${LW_SUPPLY_INTERVAL_SECS:-0}" # Supply dock refill every (secs)
      LW_RENT_MINUTES: "${LW_RENT_MINUTES:-15}"              # Rent every (minutes)
      LW_RENT_FIXED: "${LW_RENT_FIXED:-0}"                   # Rent: flat amount (0 = by value)
      LW_RENT_PERCENT: "${LW_RENT_PERCENT:-5}"               # Rent: % of base value
      LW_RENT_FLOOR: "${LW_RENT_FLOOR:-500}"                 # Rent: minimum amount
      LW_RENT_GRACE_CYCLES: "${LW_RENT_GRACE_CYCLES:-1}"     # Rent: free cycles before the first payment
      LW_IMMUNITY_SECS: "${LW_IMMUNITY_SECS:-180}"           # Spawn protection when joining (seconds, 0 = off)
      LW_IMMUNITY_COOLDOWN_SECS: "${LW_IMMUNITY_COOLDOWN_SECS:-900}" # Protection is not renewed for (seconds after it ends)
      LW_RENT_DAMAGE_PERCENT: "${LW_RENT_DAMAGE_PERCENT:-1}" # Damage per unpaid stack (%)
      LW_ABSENT_MINUTES: "${LW_ABSENT_MINUTES:-30}"          # Keep an absent base (minutes)
      LW_COMBAT_SECS: "${LW_COMBAT_SECS:-30}"                # Combat grace period (seconds)
      # every setting above can also be set in um_server.ini; LW_ variables win over the file
volumes:
  lw-world:
