; Living World server settings. Every value is optional. zh_host.exe (window or --cli) reads this file; command-line options such as --port override it.

[server]
name = Living World   ; Server name   (option --name)
game_dir =    ; Zero Hour folder   (option --game-dir)
; map: <city>-<size> with city london, newyork, paris or dubai and size small (1.4 km, the largest retail map size), medium (4.8 km) or large (10 km),
;      e.g. london-medium; or grand (generated, 1.6 km), desert (Tournament Desert), or a .map path. Small maps suit older PCs and fewer players.
; Every map keeps its own persistent world in <world_dir>\<codename>, so switching maps and back resumes each world where it was.
map = london-medium   ; Map (codename or .map path)   (option --map)
host = 0.0.0.0   ; Listen on (address)   (option --host)
port = 7777   ; Game port   (option --port)
status_port = 8080   ; Status page port (0 = off)   (option --status-port)
world_dir = world   ; World folder (saves)   (option --world-dir)

[world]
max_players = 16   ; Max players (seats)   (option --max-players)
max_ai = 16   ; Max AI players at once   (option --max-ai)
start_ai = 4   ; AI players at world start   (option --start-ai)
ai_pool = 24   ; AI seats (at least max AI)   (option --ai-pool)
game_speed = 30   ; Game speed (15-60, default 30)   (option --game-speed)
ai_join_secs = 20   ; Seconds between AI joining   (option --ai-join-secs)
epoch_secs = auto   ; Save the world every (seconds; auto = 300, 600 on medium and 900 on large city maps)   (option --epoch-secs)
spawn_deadzone = auto   ; Spawn deadzone (metres; auto = 120 small, 250 medium, 400 large): a new base only goes where no other player has anything this close; no free spot = the join is refused   (option --spawn-deadzone)
ai_reserve_lots = 4   ; Spawn lots kept free for players: AI only joins while more lots than this are free   (option --ai-reserve-lots)

[rules]
start_cash = 10000   ; Starting cash   (option --start-cash)
last_hit_bonus = 10000   ; Knock-out bonus: flat amount   (option --last-hit-bonus)
last_hit_window_secs = 300   ; Last hit counts for (seconds)   (option --last-hit-window)
supply_interval_secs = 0   ; Supply dock refill every (secs)   (option --supply-interval)
rent_minutes = 15   ; Rent every (minutes)   (option --rent-minutes)
rent_fixed = 0   ; Rent: flat amount (0 = by value)   (option --rent-fixed)
rent_percent = 5   ; Rent: % of base value   (option --rent-percent)
rent_floor = 500   ; Rent: minimum amount   (option --rent-floor)
rent_grace_cycles = 1   ; Rent: free cycles before the first payment   (option --rent-grace)
immunity_secs = 180   ; Spawn protection when joining (seconds, 0 = off)   (option --immunity-secs)
immunity_cooldown_secs = 900   ; Protection is not renewed for (seconds after it ends)   (option --immunity-cooldown)
rent_damage_percent = 1   ; Damage per unpaid stack (%)   (option --rent-damage)
absent_minutes = 30   ; Keep an absent base (minutes)   (option --absent-minutes)
combat_secs = 30   ; Combat grace period (seconds)   (option --combat-secs)


[economy]
pools = 1   ; Money pools cap generator income (1 = on)   (option --pools)
pool_seed = 50000   ; Pool: starting amount per currency   (option --pool-seed)
pool_join = 2000   ; Pool: added when a player joins   (option --pool-join)
pool_depot_percent = 60   ; Pool share: supply depots (%)   (option --pool-depot)
pool_derrick_percent = 10   ; Pool share: oil derricks (%)   (option --pool-derrick)
pool_other_percent = 30   ; Pool share: Black Market, hackers, supply drops (%)   (option --pool-other)
inflation = 0   ; Inflation: prices and rent follow GDP (1 = on)   (option --inflation)
gdp_baseline = 200000   ; Inflation: GDP at which prices start to rise   (option --gdp-baseline)
inflation_max_percent = 300   ; Inflation: highest price level (%)   (option --inflation-max)
deflation_permille = 20   ; Deflation: pool tax per cycle (per mille)   (option --deflation)
